name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-simulator:
    name: Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Build for Testing
        run: |
          xcodebuild build-for-testing \
            -scheme AdaptivePanel \
            -destination 'platform=iOS Simulator,name=iPhone 17'

      - name: Test without Building
        run: |
          xcodebuild test-without-building \
            -scheme AdaptivePanel \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -enableCodeCoverage YES

  build-device:
    name: Build (iphoneos)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Build for Device
        run: |
          xcodebuild build \
            -scheme AdaptivePanel \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  swiftpm-check:
    name: SwiftPM Check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: SwiftPM Check
        run: |
          swift package resolve
